name: bangladesh_landmarks
description: A Flutter application for managing and visualizing landmark records in Bangladesh.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.2
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.2
  
  # State Management
  provider: ^6.0.5
  
  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  location: ^5.0.3
  geolocator: ^10.1.0
  
  # Image Handling
  image_picker: ^1.0.4
  image: ^4.1.3
  
  # Storage
  shared_preferences: ^2.2.2
  
  # UI Enhancements
  cached_network_image: ^3.3.0
  flutter_spinkit: ^5.2.0
  
  # Utils
  intl: ^0.18.1
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
  
  # Fonts will use system defaults